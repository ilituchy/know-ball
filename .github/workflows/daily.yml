name: Daily player

on:
  schedule:
    - cron: "0 11 * * *" # 6 or 7am New York
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild today's player
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        sport: [nba]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t .
      - run: python -m knowball.generate --sport ${{ matrix.sport }} ${{ inputs.force && '--force' || '' }}
      - name: Commit today's player
        run: |
          git config user.name "know-ball-bot"
          git config user.email "know-ball-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "${{ matrix.sport }}: player for $(date -u +%F)"
          git pull --rebase
          git push
